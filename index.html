<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>
    <title>Game Map</title>
    <link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#9e9482">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta
    name="mobile-web-app-capable"
    content="yes"
>
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<meta
    name="apple-mobile-web-app-title"
    content="Game Map"
>

    <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
>

    <link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Teko:wght@500;600;700&display=swap"
    rel="stylesheet"
>
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div id="map"></div>
    
    <div id="searchBox">

    <input
        id="searchInput"
        aria-label="Yer ara"
        type="text"
        placeholder="Nereye?"
        autocomplete="off"
    >

    <button id="searchButton">
        ARA
    </button>

    <button id="routeButton">
        ROTA
    </button>

    <div id="searchResults"></div>

</div>
<div id="routeModeBar" hidden>

    <button
        type="button"
        class="routeModeButton active"
        data-route-mode="car"
    >
        ARAÇ
    </button>

    <button
        type="button"
        class="routeModeButton"
        data-route-mode="walk"
    >
        YÜRÜME
    </button>

    <button
        type="button"
        class="routeModeButton"
        data-route-mode="bike"
    >
        BİSİKLET
    </button>

</div>

<button
    id="poiSearchAreaButton"
    type="button"
    hidden
>
    BU ALANDA ARA
</button>
<div
    id="poiStatus"
    hidden
>
    YERLER ARANIYOR...
</div>
<div id="routeInfo">

    <span id="routeTime">
        -- dk
    </span>

    <span>•</span>

    <span id="routeDistance">
        -- km
    </span>

</div>


<div id="navigationInstruction">

    <span id="navigationArrow"></span>

    <div id="navigationWords">
        <span id="navigationDistance"></span>
        <span id="navigationAction"></span>
        <span id="navigationRoad"></span>
    </div>

</div>


<div id="speedHud">

    <span id="speedValue">
        0
    </span>

    <span id="speedUnit">
        KM/H
    </span>

</div>
    
    <button id="locationButton">KONUMUM</button>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <aside id="mapTools" aria-label="Harita araçları">
        <div id="connectionStatus" role="status">GPS kapalı</div>
        <button id="toolsToggle" aria-expanded="false" aria-controls="toolsPanel">MENÜ</button>
        <section id="toolsPanel" hidden aria-label="Harita menüsü">
            <h2>YOL ARKADAŞIN</h2>
            
            <button id="pickDestination">HARİTADAN HEDEF SEÇ</button>
            <button id="saveFavorite">HEDEFİ FAVORİYE EKLE</button>
            <button id="voiceToggle" aria-pressed="false">SES: KAPALI</button>
            <button id="wakeToggle" aria-pressed="false">EKRANI AÇIK TUT: KAPALI</button>
            <button id="cancelRoute">ROTAYI TEMİZLE</button>
            <h3>HARİTA TEMASI</h3>

<div id="themeControls">

    <button
        class="themeButton"
        data-theme="classic"
        type="button"
        aria-pressed="true"
    >
        SAN ANDREAS
    </button>

    <button
        class="themeButton"
        data-theme="gtav"
        type="button"
        aria-pressed="false"
    >
        GTA V
    </button>

</div>
            <h3>YERLER</h3>

<div id="poiCategoryControls">

    <button
        class="poiCategoryButton"
        data-poi-category="market"
        type="button"
        aria-pressed="true"
    >
        ✓ MARKET
    </button>


    <button
        class="poiCategoryButton"
        data-poi-category="restaurant"
        type="button"
        aria-pressed="true"
    >
        ✓ YEMEK
    </button>


    <button
        class="poiCategoryButton"
        data-poi-category="cafe"
        type="button"
        aria-pressed="true"
    >
        ✓ KAFE
    </button>


    <button
        class="poiCategoryButton"
        data-poi-category="health"
        type="button"
        aria-pressed="true"
    >
        ✓ SAĞLIK
    </button>


    <button
        class="poiCategoryButton"
        data-poi-category="fuel"
        type="button"
        aria-pressed="true"
    >
        ✓ BENZİNLİK
    </button>


    <button
        class="poiCategoryButton"
        data-poi-category="hotel"
        type="button"
        aria-pressed="true"
    >
        ✓ OTEL
    </button>


    <button
        class="poiCategoryButton"
        data-poi-category="gym"
        type="button"
        aria-pressed="true"
    >
        ✓ GYM
    </button>


    <button
        class="poiCategoryButton"
        data-poi-category="clothing"
        type="button"
        aria-pressed="true"
    >
        ✓ GİYİM
    </button>

</div>
            <h3>FAVORİLER</h3><div id="favoritePlaces"></div>
            <h3>SON HEDEFLER</h3><div id="recentPlaces"></div>
        </section>
    </aside>
    <div id="routeChoices" aria-label="Alternatif araç rotaları"></div>
    <div id="appNotice" role="status" hidden></div>
    <div
    id="updateNotice"
    hidden
>

    <span>
        YENİ SÜRÜM HAZIR
    </span>

    <button
        id="updateButton"
        type="button"
    >
        YENİLE
    </button>

</div>
<script src="themes.js"></script>
    
<script src="services.js"></script>
<script src="app.js"></script>
<script src="features.js"></script>
<script src="pois-native.js"></script>
</body>

</html>
